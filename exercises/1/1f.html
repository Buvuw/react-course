<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/dayjs.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      const productCost = 10 + 8 + 8;
      const shippingCost = 5;
      const totalCost = productCost + shippingCost;

      const productCostText = <p>Product cost: ${productCost}</p>
      const shippingCostText = <p>Shipping cost: ${shippingCost}</p>
      const totalCostText = <p>Total cost: ${totalCost}</p>
      const button = <button>Place your order</button>

      const div = (
        <div>
          {productCostText}
          {shippingCostText}
          {totalCostText}
          {button}
        </div>
      );
      
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(div);
    </script>
  </body>
</html>
